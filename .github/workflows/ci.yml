name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ runner.os }} / Python ${{ matrix.python }} / Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.10"
          - "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: JavaScript and native plugin verification
        run: npm run check
      - name: Python verification
        run: npm run test:python
      - name: Install distribution builder
        run: python -m pip install --disable-pip-version-check "build==1.6.1"
      - name: Build Wheel and SDist
        run: python -m build
      - name: Fresh Wheel and SDist installation
        run: python -X utf8 -B scripts/verify-python-release.py --dist dist
      - name: Packed plugin extraction and offline smoke
        run: npm run pack:check
