[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awa-ddd"
version = "2.0.0"
description = "Evidence-driven security assessment engine for DeepSeek Harness: Universe, Hypothesis, Recipe and Campaign"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
awa-ddd = "awa_ddd.__main__:main"

[tool.setuptools.packages.find]
include = ["awa_ddd*"]
